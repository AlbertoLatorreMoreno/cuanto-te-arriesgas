  <body>
    <main id="app" class="app">
      <p class="cargando">Cargando…</p>
    </main>
    <div id="avisos" class="avisos" aria-live="polite"></div>
    <script>
      // Abierta con doble clic (file://), el navegador no carga los módulos: se explica en vez de quedarse en «Cargando…».
      if (location.protocol === "file:") {
        document.getElementById("app").innerHTML =
          '<p class="cargando">Esta app hay que abrirla desde un servidor, no con doble clic. Mira el README: «Jugar en el ordenador».</p>';
      } else {
        // Justo después de publicar una actualización, el navegador puede mezclar un archivo nuevo
        // con otro viejo de su caché y la app no llega a arrancar. Si un archivo falla antes de
        // arrancar, se ofrece recargar (la recarga pide al servidor las versiones actuales).
        window.addEventListener(
          "error",
          function () {
            if (window.__app) return;
            document.getElementById("app").innerHTML =
              '<div class="pantalla-pasar"><h2>No se ha podido cargar el juego</h2>' +
              '<p class="texto-suave">Puede que se esté actualizando. Recarga la página.</p>' +
              '<button id="recargar" class="boton boton-primario boton-ancho">Recargar</button></div>';
            // Sin «onclick» en el HTML: la política de seguridad (CSP) no deja ejecutar código escrito en atributos.
            document.getElementById("recargar").addEventListener("click", function () {
              location.reload();
            });
          },
          true,
        );
      }
    </script>
    <noscript><p class="cargando">Esta app necesita JavaScript.</p></noscript>
  </body>
